project_id = "medquiz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://medquiz-europe.medcompass-web.workers.dev"
additional_redirect_urls = ["http://localhost:8081", "http://127.0.0.1:8081", "medquiz://**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 600

[functions.entitlement]
verify_jwt = false
[functions.revenuecat-webhook]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.stripe-billing]
verify_jwt = false
[functions.stripe-webhook]
verify_jwt = false
